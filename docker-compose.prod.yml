x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true

services:
  tunnel_setup:
    <<: *security-defaults
    image: node:22-alpine
    profiles: [tunnel]
    restart: 'no'
    command: ['node', '/app/cloudflare-tunnel.mjs']
    environment:
      APP_DOMAIN: ${PROD_APP_DOMAIN:-${APP_DOMAIN:-}}
      APP_ENVIRONMENT: production
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_TUNNEL_NAME: ${PROD_CLOUDFLARE_TUNNEL_NAME:-}
      CLOUDFLARE_ORIGIN_URL: http://proxy:80
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /run/cloudflare/tunnel-token
    volumes:
      - ./infrastructure/cloudflare-tunnel.mjs:/app/cloudflare-tunnel.mjs:ro
      - cloudflare-runtime:/run/cloudflare
    networks: [starter]

  cloudflared:
    <<: *security-defaults
    image: cloudflare/cloudflared:2026.5.2
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token-file /run/cloudflare/tunnel-token
    restart: unless-stopped
    volumes:
      - cloudflare-runtime:/run/cloudflare:ro
    depends_on:
      tunnel_setup:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    networks: [starter]

  proxy:
    <<: *security-defaults
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - '${PROD_HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [starter]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    <<: *security-defaults
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fullstack Starter}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:-A production-ready full-stack starter.}
        NEXT_PUBLIC_APP_DOMAIN: ${PROD_APP_DOMAIN:-${APP_DOMAIN:-}}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-/}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-/api/auth}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/frontend/.next/cache:rw,noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks: [starter]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    <<: *security-defaults
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Fullstack Starter}
      APP_DOMAIN: ${PROD_APP_DOMAIN:-${APP_DOMAIN:-}}
      BACKEND_PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RUN_DATABASE_MIGRATIONS: ${RUN_DATABASE_MIGRATIONS:-true}
      CACHE_URL: redis://cache:6379
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SEARCH_ENGINE_URL: http://search_engine:7700
      SEARCH_ENGINE_MASTER_KEY: ${SEARCH_ENGINE_MASTER_KEY}
      VIRUS_SCANNER_HOST: virus_scanner
      VIRUS_SCANNER_PORT: '3310'
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost/api/auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ALLOWED_PRICE_IDS: ${STRIPE_ALLOWED_PRICE_IDS:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Fullstack Starter <noreply@example.com>}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      search_engine:
        condition: service_healthy
      virus_scanner:
        condition: service_healthy
    networks: [starter]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:4000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    <<: *security-defaults
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [starter]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      ['postgres', '-c', 'max_connections=200', '-c', 'shared_buffers=256MB']

  cache:
    <<: *security-defaults
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [starter]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  search_engine:
    <<: *security-defaults
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${SEARCH_ENGINE_MASTER_KEY}
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - search-engine-data:/meili_data
    networks: [starter]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:7700/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  virus_scanner:
    <<: *security-defaults
    image: clamav/clamav:stable
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - virus-scanner-data:/var/lib/clamav
    networks: [starter]
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  db-data:
  redis-data:
  search-engine-data:
  virus-scanner-data:
  cloudflare-runtime:

networks:
  starter:
    driver: bridge
